  <meta property="og:title" content="Gorditas Becerra's Ranch">
  <meta property="og:description" content="Consulta nuestro menú y pide por WhatsApp a sucursal Colosio o Sur.">
  <meta property="og:image" content="/assets/logo.png">

  <style>
    :root {
      --maroon-900: #140707;
      --maroon-800: #2a0a0c;
      --maroon-700: #4a0b0f;
      --maroon-600: #6e1016;
      --maroon-500: #8e1a20;
      --silver: #ecebe8;
      --silver-dim: #bdb6b0;
      --cream: #efe6da;
      --wood: #7a4a2a;
      --wood-dark: #4a2a15;
      --whatsapp: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Oswald", "Arial Narrow", sans-serif;
      color: var(--silver);
      background: var(--maroon-900);
      background-image: radial-gradient(ellipse at 50% 30%, var(--maroon-600) 0%, var(--maroon-700) 35%, var(--maroon-800) 65%, var(--maroon-900) 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 24px;
    }

    main {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
    }

    .logo {
      width: min(62vw, 240px);
      height: auto;
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(236, 235, 232, .08), 0 18px 50px rgba(0, 0, 0, .55);
      animation: rise .7s ease-out both;
    }

    h1 {
      font-family: "Rye", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 7vw, 2.3rem);
      line-height: 1.1;
      letter-spacing: .02em;
      margin-top: 22px;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .45);
    }

    .tagline {
      margin-top: 8px;
      font-size: .95rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--silver-dim);
    }

    .divider {
      width: 120px;
      height: 10px;
      margin: 22px auto 26px;
      background:
        radial-gradient(circle, var(--silver) 2px, transparent 2.5px) center / 10px 10px no-repeat,
        linear-gradient(var(--silver-dim), var(--silver-dim)) left center / 48px 1px no-repeat,
        linear-gradient(var(--silver-dim), var(--silver-dim)) right center / 48px 1px no-repeat;
      opacity: .7;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-label {
      margin: 18px 0 2px;
      font-size: .8rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--silver-dim);
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 60px;
      padding: 12px 20px;
      border-radius: 14px;
      border: 2px solid rgba(236, 235, 232, .85);
      background: rgba(20, 7, 7, .35);
      color: var(--silver);
      text-decoration: none;
      font-size: 1.08rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: transform .15s ease, background-color .15s ease, color .15s ease;
      animation: rise .6s ease-out both;
    }

    .btn:hover, .btn:focus-visible {
      background: var(--silver);
      color: var(--maroon-700);
      transform: translateY(-2px);
    }

    .btn:focus-visible { outline: 3px solid var(--silver); outline-offset: 3px; }

    .btn svg { width: 26px; height: 26px; flex: none; fill: currentColor; }

    .btn span { flex: 1; text-align: left; }

    .btn small {
      display: block;
      font-size: .78rem;
      letter-spacing: .1em;
      opacity: .75;
    }

    .btn .arrow { width: 18px; height: 18px; opacity: .6; }

    .btn-menu {
      border-color: var(--wood-dark);
      background: linear-gradient(180deg, #8a5634 0%, var(--wood) 55%, #683c20 100%);
      color: var(--cream);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 8px 20px rgba(0, 0, 0, .35);
    }

    .btn-menu span { font-family: "Rye", Georgia, serif; font-weight: 400; font-size: 1.15rem; letter-spacing: .06em; }

    .btn-menu:hover, .btn-menu:focus-visible { background: var(--cream); color: var(--wood-dark); }

    .btn-wa svg:first-child { color: var(--whatsapp); }
    .btn-wa:hover svg:first-child, .btn-wa:focus-visible svg:first-child { color: #128c4a; }

    .links > :nth-child(1) { animation-delay: .1s; }
    .links > :nth-child(2) { animation-delay: .15s; }
    .links > :nth-child(3) { animation-delay: .2s; }
    .links > :nth-child(4) { animation-delay: .25s; }
    .links > :nth-child(5) { animation-delay: .3s; }
    .links > :nth-child(6) { animation-delay: .35s; }
    .links > :nth-child(7) { animation-delay: .4s; }

    footer {
      margin-top: 40px;
      font-size: .8rem;
      letter-spacing: .12em;
      color: var(--silver-dim);
      opacity: .7;
      text-align: center;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .btn { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
