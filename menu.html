<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú · Gorditas Becerra's Ranch</title>
  <meta name="description" content="Menú de Gorditas Becerra's Ranch: gorditas desde $25, bebidas, brownie y empanadas.">
  <meta name="theme-color" content="#4a0b0f">
  <meta property="og:title" content="Menú · Gorditas Becerra's Ranch">
  <meta property="og:image" content="/assets/menu.jpg">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/fonts.css">
  <style>
    :root {
      --maroon-900: #140707;
      --maroon-800: #2a0a0c;
      --maroon-700: #4a0b0f;
      --maroon-600: #6e1016;
      --silver: #ecebe8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Oswald", "Arial Narrow", sans-serif;
      color: var(--silver);
      background: var(--maroon-900);
      background-image: radial-gradient(ellipse at 50% 30%, var(--maroon-600) 0%, var(--maroon-700) 35%, var(--maroon-800) 65%, var(--maroon-900) 100%);
      background-attachment: fixed;
      padding: 16px 16px 32px;
    }

    main { max-width: 720px; margin: 0 auto; }

    .back {
      display: inline-flex; align-items: center; gap: 4px;
      margin-bottom: 14px;
      padding: 8px 14px 8px 8px;
      border-radius: 999px;
      border: 2px solid rgba(236, 235, 232, .85);
      color: var(--silver);
      font-size: .9rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { background: var(--silver); color: var(--maroon-700); }
    .back svg { width: 18px; height: 18px; fill: currentColor; }

    .menu {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7 1.4-1.4-5.6-5.6 5.6-5.6z"/></svg>
      Inicio
    </a>
    <img class="menu" src="/assets/menu.jpg" width="900" height="1600"
      alt="Menú. Gorditas $27: picadillo, carnitas, chicharrón prensado, deshebrada, chicharrón en salsa verde, quesadilla, del jefe (jocoque con huevo en chile colorado), frijoles con queso. Gorditas $25: huevo con chorizo, huevo con salsa, nopalitos, papas con chile colorado, queso con rajas. Ingrediente adicional $6. Bebidas $35: agua embotellada, café, refresco botella, refresco lata, jugo, aguas de sabores, brownie. Empanada $17.">
  </main>
</body>
</html>
